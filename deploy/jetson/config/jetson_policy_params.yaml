policy_node:
  ros__parameters:
    # --- Configuración del Modelo en Borde (Jetson Orin Nano) ---
    model_type: "diffusion"
    checkpoint_path: "/ros_ws/model"

    # --- Configuración de Inferencia y Rendimiento en Tiempo Real ---
    # Frecuencia de control reactivo en Hz
    inference_hz: 20.0
    
    # Pasos de difusión inversa (DDIM Denoising Steps)
    # 10 pasos en Jetson Orin Nano con FP16 toma ~25-35 ms, permitiendo holgadamente 20 Hz
    num_inference_steps: 10
    
    # Pasos de acción ejecutados antes de replanificar (3 = solapamiento de 13 pasos para máxima suavidad)
    n_action_steps: 3
    
    # Temporal Ensemble para mitigar jitter motor en lazo cerrado
    use_temporal_ensemble: True
    temporal_ensemble_k: 0.0

    # --- Configuración de Sensores y Tópicos de Hardware Real ---
    # Tópico de la cámara física (cambiar según el driver usado: RealSense, V4L2 USB Cam, etc.)
    # Debe ser la MISMA D435i (640x480 a 30 Hz) y el mismo montaje que en la recolección. realsense-ros 4.x publica
    # /camera/camera/color/image_raw (tópico usado por vo_collector_node); verificar con `ros2 topic list` en la Jetson.
    camera_topic: "/camera/camera/color/image_raw"
    # xArm5 real: el puente xarm5_bridge publica la apertura del gripper ya convertida a la escala de la
    # política (0.0 abierto .. -0.01 cerrado) con nombre "gripper" (ver config/xarm5/xarm5_real_params.yaml).
    joint_states_topic: "/visuomotor/gripper_joint_states"
    gripper_joint_name_pattern: "gripper"
    gripper_open_pos: 0.0
    gripper_closed_pos: -0.01
    gripper_binary_threshold: -0.001
    action_chunk_topic: "policy/action_chunk"
    # Duración de la fase RESET (envía la pose home antes de ceder el control a la red)
    reset_duration_s: 5.0

    # Marcos de referencia cinemáticos (TF2)
    # xArm5 real: TF link_base -> xarm_tcp publicada por xarm5_bridge desde la pose del controlador.
    ee_frame: "xarm_tcp"
    base_frame: "link_base"
    
    # Resolución de entrada de la red (256x256 RGB)
    image_size: 256
    # Igual que vo_collector_node (cv2.INTER_AREA 640x480 -> 256x256): paridad exacta con el dataset real.
    image_resize_method: "cv2_area"
    
    # Posición Home segura de inicio / reposo (metros y radianes)
    # = HOME3 del xArm5 real (pose de trabajo con el efector alineado, home3_joints_rad en xarm5_real_params.yaml;
    # TCP = brida, offset del controlador 0). Es también el ORIGEN de las demostraciones: tools/xarm5/
    # convert_vio_dataset_to_xarm5.py lee estos valores para llevar el dataset VIO a link_base, así que el checkpoint
    # entrenado con ese dataset y esta inferencia usan el mismo home. Si se cambia, reconvertir el dataset.
    # Medido en el brazo real en HOME3 (2026-11-20, pose reportada por el controlador; TCP = brida):
    # garra inclinada ~-24.6° en el plano del brazo. Si se redefine HOME3, actualizar aquí y reconvertir el dataset.
    # La fase RESET envía esta pose y el puente rechaza objetivos a más de max_target_distance_m del TCP.
    # Centrado en y = 0 (J1/J5 -0.03503 rad): valor PREVISTO hasta re-medir tras go_home3.
    home_x: 0.15009
    home_y: 0.00000
    home_z: 0.75000
    home_roll: 3.10176
    home_pitch: -0.42961
    home_yaw: -0.01136

    # --- Coordenadas Relativas (Modo UMI / Delta-Home) ---
    # Debe coincidir con cómo se entrenó el checkpoint: true resta home (home_x/y/z, = HOME3) a la observación y lo
    # suma a la acción predicha. Valor explícito (mismo que visuomotor_ros2/config/policy_params.yaml).
    relative_coordinates: true

    # --- Convención de signo del cuaternión (estado observado y acciones) ---
    # "auto" (recomendado): usar la convención guardada en config.json del checkpoint ("home" para datasets reales
    # convertidos con xarm5_dataset_alignment.yaml, "qw_positive" para modelos históricos). Forzar "home" o
    # "qw_positive" solo para depurar: si no coincide con el checkpoint, policy_node se detiene con un error.
    quaternion_hemisphere: "auto"

    # --- Auto-Stop Neuronal Desacoplado ---
    enable_neural_auto_stop: true
    # Calibrado offline (Fase 22) con tools/xarm5/replay_policy_offline.py sobre los 8 episodios de validación de
    # demonstrations_real_v7_xarm5_v2 (checkpoints épocas 180/200/220): 0.6 durante 5 pasos consecutivos (0.25 s) detuvo
    # el 100% de los episodios, 0 paradas prematuras, ~8 mm de la meta. Con 0.50/1 había 2 paradas > 1 s adelantadas.
    neural_auto_stop_threshold: 0.60
    neural_auto_stop_patience_steps: 5
    
    enable_heuristic_auto_stop: false
    auto_stop_variance_threshold: 1.0e-7
    auto_stop_patience_steps: 20

    # --- Telemetría de Diagnóstico en Tiempo Real ---
    enable_metrics_publish: true
    metrics_prefix: "/policy/metrics"
