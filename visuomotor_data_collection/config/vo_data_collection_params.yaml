vo_collector_node:
  ros__parameters:
    # 'AUTO' para crear nueva versión incremental demonstrations_real_vX.zarr,
    # o nombre/ruta para continuar aumentando dataset existente (ej. 'demonstrations_real_v5')
    dataset_path: "AUTO"
    dataset_prefix: "demonstrations_real"
    sampling_rate_hz: 20.0
    relative_coordinates: true
    camera_topic: "/camera/camera/color/image_raw"
    odom_topic: "/rtabmap/odom"
    odom_info_topic: "/odom_info"          # rtabmap_msgs/OdomInfo de rgbd_odometry (inliers, lost)
    imu_topic: "/camera/camera/imu"        # gravedad al inicio del episodio (atributo start_gravity_mps2)
    gripper_topic: "/visuomotor/gripper_joint_states"
    gripper_closed_val: -0.005
    image_size: 256
    min_hold_duration_s: 2.0
    record_done_flag: true

    # ---- Recolector v2 (plan docs/plans/plan_d435i_herramienta_demostraciones.md, Fase 4) ----
    # Calidad de rastreo: frames con menos inliers cuentan como problema de QA (en v1 se declaraba y no se usaba).
    min_inliers_tracking: 20
    # Emparejamiento imagen-pose por sello: la imagen más cercana debe estar a <= max_image_dt_s del instante del
    # frame (cámara a 30 Hz: 1/60 s + margen); si no, el frame queda marcado como perdido.
    max_image_dt_s: 0.02
    max_pose_gap_s: 0.10                   # hueco máximo entre poses de odometría para interpolar
    image_wait_s: 0.05                     # espera máxima a una imagen atrasada antes de marcar el frame
    # Reinicio de la odometría al empezar cada episodio (en v7 la vertical de odom derivó 50-60° en una sesión).
    reset_odom_on_start: true
    # Servicio privado del nodo rgbd_odometry (~/reset_odom). Era "/reset_odom", que no existe: ninguna demo se
    # reiniciaba y, una vez perdida, la odometría seguía perdida en las siguientes (visto en vivo el 2026-11-25).
    reset_odom_service: "/rgbd_odometry/reset_odom"
    reset_settle_frames: 10                # poses válidas tras el reinicio antes de empezar a grabar
    reset_timeout_s: 3.0
    # Etiqueta done: tramo final quieto (velocidad suavizada en static_window_s <= static_speed_m_s).
    static_speed_m_s: 0.02
    static_window_s: 0.5
    auto_hold: false                       # true: si no se pulsó [H], detectar el tramo final quieto
    # true: no se guarda un episodio con problemas de QA (descartar con [D] o forzar con [F]).
    strict_qa: true
    # false (v8, con bag crudo; lo pone run_v8_session.sh): las pérdidas de la odometría EN VIVO quedan como aviso
    # (qa_warnings) y no bloquean, porque las poses del dataset se recalculan offline con DROID desde el bag crudo.
    qa_tracking_blocking: true
    # Si la odometría en vivo está perdida al final (la pose se congela y parecería quieta), el final quieto lo decide
    # el giróscopo: |w| suavizado < umbral durante min_hold + margen. El done empieza ahí (done_source: imu).
    imu_still_gyro_rad_s: 0.08
    imu_still_smooth_s: 0.15
    # [S]/[F] a mano: se quitan los últimos 0,3 s (el movimiento de apretar la tecla con la cámara en la mano).
    manual_save_trim_s: 0.3
    # Tramo done "quieto": a lo más esta fracción de sus frames sobre static_speed_m_s (picos de la mano y del ruido de
    # la odometría cerca de la mesa; antes 0: 1-3 frames de ~50 rechazaban demos buenas, 2026-11-25).
    qa_hold_max_moving_frac: 0.2
    # "imu" (v8, lo pone run_v8_session.sh): el movimiento dentro del tramo final lo decide el giróscopo; lo de la
    # odometría en vivo (se pierde y salta cerca de la mesa y con la vista en diagonal) queda como aviso.
    qa_hold_motion_source: "odometry"
    # [S] = decisión del operador: los problemas del tramo final quedan como avisos y la demo se guarda (sin tramo
    # quieto, done en los últimos min_hold_duration_s). El done del dataset final se recalcula offline con DROID.
    manual_save_overrides_hold_qa: true
    min_episode_frames: 20
    # Grabación cruda por episodio (rosbag2 MCAP) para reprocesar la odometría offline. Requiere que existan los
    # tópicos comprimidos (image_transport) o cambiar la lista por los crudos (~46 MB/s).
    raw_bag_enabled: false
    raw_bag_dir: "datasets/raw_bags"
    # v3.1: el bag empieza en ARMING (cámara QUIETA mientras se reinicia la odometría), no con el pitido de "Grabando".
    # Esos frames y el acelerómetro dan la pose REAL de inicio (tools/xarm5/estimate_start_poses.py).
    raw_bag_preroll_arming: true
    # /tf_static se graba con QoS TRANSIENT_LOCAL (vo_raw_recorder.py).
    raw_bag_topics:
      - "/camera/camera/color/image_raw/compressed"
      - "/camera/camera/aligned_depth_to_color/image_raw/compressedDepth"
      - "/camera/camera/color/camera_info"
      - "/camera/camera/imu"
      - "/rtabmap/odom"
      - "/odom_info"
      - "/tf_static"

    # ---- Recolector v3 (2026-11-24): guía de inicio a HOME3, inicio/guardado automáticos y programa ----
    # Guía de inicio: compara los ArUco de la mesa con la vista de la cámara del robot en HOME3 (referencia generada
    # con tools/hardware/make_home3_view_reference.py desde los 14 intentos reales). Verla en vivo con:
    #   ros2 run rqt_image_view rqt_image_view /vo_collector_node/start_guide
    # En la referencia, el robot repite HOME3 con < 1 px; las demos v7 empezaban con escala 0,88-1,26 y hasta ~80 px de
    # corrimiento.
    start_guide_enabled: true
    start_guide_reference: "visuomotor_bringup/config/realsense/home3_view_reference.yaml"
    start_guide_tolerance_px: 8.0          # error medio de esquina, en píxeles de 640x480
    start_guide_min_markers: 2
    start_guide_required: true             # [ESPACIO] no empieza fuera de tolerancia; [I] empieza igual (queda registrado)
    start_guide_rate_hz: 5.0
    start_guide_image_topic: "~/start_guide"
    end_view_box_frac: 0.5                 # recuadro central de la imagen de guía durante la grabación (llegada)
    # Inicio automático: empieza cuando la vista lleva auto_start_hold_s alineada y quieta (tocar el teclado mueve la
    # cámara). Guardado automático: guarda cuando la cámara ya se alejó del inicio y lleva quieta al final
    # min_hold_duration_s + auto_save_margin_s. NO hacer pausas largas a mitad de camino con auto_save activo.
    auto_start: false
    auto_start_hold_s: 1.0
    auto_start_max_motion_px: 3.0
    auto_start_cooldown_s: 3.0             # tras guardar o descartar, antes de poder empezar solo otra vez
    auto_save: false
    auto_save_min_travel_m: 0.10
    auto_save_margin_s: 0.5
    # Aviso de velocidad. v7: máxima por episodio con mediana 0,11 m/s y p90 0,15 m/s; media 0,055 m/s. En los
    # ensayos el puente del xArm5 limitó a 0,05 m/s.
    max_demo_speed_m_s: 0.15
    # Monitor del alcance del xArm5 (reach_monitor.py; lo activa run_v8_session.sh): con la odometría en vivo y la
    # extrínseca medida avisa si la cámara en la mano va a una pose que el robot no alcanza ("baja primero").
    reach_monitor_enabled: false
    reach_warn_ratio: 0.97
    reach_warn_period_s: 2.5
    terminal_bell: true                    # pitido de la terminal al empezar, guardar o rechazar
    # Programa de recolección (CSV de tools/hardware/make_collection_schedule.py; "" = sin programa).
    schedule_file: ""
    # Guía v8 (2026-11-25): grilla numerada SOBRE LA MESA, proyectada con la homografía de los ArUco detectados.
    schedule_cells_m_file: "visuomotor_bringup/config/realsense/v8_cells.yaml"
    table_markers_file: "visuomotor_bringup/config/realsense/table_markers.yaml"
    schedule_legacy_id: "v8_schedule"          # programa de los episodios sin schedule_id (anteriores al 2026-11-25)

    # Trazabilidad: raíz del repo (para el commit) y YAML cuyo sha256 se guarda en cada episodio.
    repo_root: "."
    config_files_to_hash:
      - "visuomotor_bringup/config/realsense/d435i_camera_params.yaml"
      - "visuomotor_bringup/config/realsense/rtabmap_vio_params.yaml"
      - "visuomotor_data_collection/config/vo_data_collection_params.yaml"
