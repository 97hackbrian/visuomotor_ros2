# Celdas de la mesa para el programa de recolección v8 (vo_schedule.py), EN METROS en link_base.
#
# Antes las celdas eran tercios de la imagen de HOME3. Pero el tercio superior de la imagen queda a x > 0,7 m, más
# allá de la caja del puente (radio <= 0,65 m), y esas demos se habrían descartado al convertirlas. Ahora la grilla
# cubre solo la zona ejecutable (comprobada con tools/hardware/make_v8_cells.py: el robot debe poder llegar a la vista
# final sobre cada celda y orientación) y deja libres los ArUco de la mesa (12 en (0,69, -0,19); 14 en (0,69, +0,15)).
#
# Numeración: teclado numérico tal como se ve en la vista de HOME3 (arriba de la imagen = lejos de la base).
#   7 8 9   lejos (x alto)        izquierda = +y (izquierda del robot)
#   4 5 6   medio
#   1 2 3   cerca de la base (x bajo)
# Referencia de v7 (punto mirado al final, p5-p95): x de 0,46 a 0,67 m e y de -0,28 a +0,16 m.
v8_cells:
  # 2026-11-25: agrandada dos veces a pedido del usuario (la primera, ±0,21 x 0,42-0,615, no cubría la mesa).
  # Mesa medida en la imagen de HOME3 con la homografía de los ArUco: mantel de y = -0,36 a +0,34 m; borde del lado de
  # la base en x = 0,39-0,40 m; ArUco desde x = 0,6635 m. Límites del robot (make_v8_cells.py, cámara con la
  # orientación de HOME3, caja del puente SIN cambios: |y| <= 0,30 para el TCP):
  # * a lo alto: 0,405 (~1 cm al borde de la mesa) a 0,633 (3 cm a los ArUco); todas las celdas alcanzables;
  # * a lo ancho es ASIMÉTRICO: la cámara va ~1,6 cm a un lado del TCP. Por la izquierda el robot llega hasta +0,33
  #   (se deja +0,31: ~3 cm al borde del mantel); por la derecha se deja -0,27 (a -0,275 el TCP ya se recorta 6 mm; a -0,28, 1 cm).
  #   Más a la derecha exige ampliar la caja del puente, y aun con |y| <= 0,36 la celda 9 falla por el radio de 0,65 m.
  x_edges_m: [0.403, 0.502, 0.601, 0.7]   # ajustada con adjust_v8_grid.py el 2026-11-25 19:55
  y_edges_m: [-0.351, -0.1207, 0.1097, 0.34]   # ajustada con adjust_v8_grid.py el 2026-11-25 19:55
  table_z_m: 0.020                        # plano de la mesa (esquinas de los ArUco, table_markers.yaml)
  marker_clearance_m: 0.03                # no tapar los ArUco: la herramienta debe quedar a >= 3 cm de ellos
  # Vista final con la que se comprueba que el robot llega: cámara sobre el centro de la celda, a esta altura,
  # mirando hacia abajo (v7: altura final p5-p95 0,18-0,42 m).
  check_heights_m: [0.25, 0.30]          # protocolo: terminar a 25-30 cm sobre la herramienta
  # Orientaciones de la herramienta (hacia dónde apuntan las HOJAS, visto desde atrás del robot; definidas por el
  # usuario el 2026-11-25): 0 = de frente (lejos de la base, +x), +90 = DERECHA (-y), -90 = IZQUIERDA (+y),
  # 180 = hacia la base. Antes: [0, 45, -45, 90] con "positivo = antihorario". El programa (make_collection_schedule.py)
  # y la comprobación de alcance usan esta lista.
  tool_yaws_deg: [-90, -45, 0, 45, 90, 180]
  # Orientación de la CÁMARA al final con la que se comprueba el alcance: [0] = la de HOME3 (protocolo: no girarla
  # siguiendo las hojas; girada, el robot no llega en las celdas lejanas con -90 o 180).
  check_camera_yaws_deg: [0]
  # La vista final puede ser en DIAGONAL: cámara a 25-30 cm de la herramienta, inclinada hacia la base hasta este
  # ángulo desde la vertical (la vista de HOME3 ya es inclinada). Así mira un brazo estirado hacia los bordes y lo
  # lejos; exigir la cámara justo encima marcaba "no llega" celdas a las que el robot llega (2026-11-25).
  check_max_tilt_deg: 45
  check_tilt_step_deg: 15
