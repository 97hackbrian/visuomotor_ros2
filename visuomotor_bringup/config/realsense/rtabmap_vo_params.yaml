/**:
  ros__parameters:
    frame_id: "camera_link"
    odom_frame_id: "odom"
    publish_tf: true
    wait_for_transform: 0.2
    approx_sync: true
    queue_size: 20
    
    # Parámetros VO calibrados para Approaching con D415
    Odom/Strategy: "0"          # 0=Frame-to-Keyframe para mínima deriva
    Odom/ResetCountdown: "0"    # 0=Desactivar reinicio a 0,0,0 en tracking loss
    Vis/CorType: "0"            # 0=Features Matching
    Vis/FeatureType: "8"        # 8=ORB nativo de OpenCV (robusto a escala y rotación)
    Vis/MaxFeatures: "1000"
    Vis/MinInliers: "10"
    Odom/FilteringStrategy: "1" # Filtro Kalman para suavizado continuo
