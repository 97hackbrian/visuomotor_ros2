/**:
  ros__parameters:
    frame_id: "camera_link"
    odom_frame_id: "odom"
    publish_tf: true
    wait_for_transform: 0.2
    approx_sync: true
    queue_size: 20
    wait_imu_to_init: true       # Esperar a la lectura inercial inicial para alinear con la gravedad
    
    # ── Parámetros VIO (Fusión Visual-Inercial) ──
    Odom/Strategy: "0"          # 0=Frame-to-Map para mínima deriva
    Odom/ResetCountdown: "0"    # 0=Desactivar reinicio a 0,0,0 en tracking loss
    Vis/CorType: "0"            # 0=Features Matching
    Vis/FeatureType: "8"        # 8=GFTT/ORB nativo de OpenCV (robusto y rápido a 30 Hz)
    Vis/MaxFeatures: "1000"
    Vis/MinInliers: "10"
    Vis/EstimationType: "1"     # 1=PnP 3D->2D
    Vis/PnPReprojError: "2.0"
    Odom/FilteringStrategy: "1" # Filtro Kalman para suavizado continuo
    Odom/AlignWithGround: "true" # Alineación automática del marco con la gravedad terrestre
