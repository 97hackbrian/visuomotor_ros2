/**:
  ros__parameters:
    frame_id: "camera_link"
    odom_frame_id: "odom"
    publish_tf: true
    wait_for_transform: 0.2
    approx_sync: true
    queue_size: 25
    wait_imu_to_init: true       # Alineación gravitacional inicial
    
    # ── 1. Estrategia Odometría (Frame-to-Map UMI-Grade) ──
    Odom/Strategy: "0"                     # 0=Frame-to-Map para mínima deriva
    Odom/GuessMotion: "false"              # Desactivado: erradica el arrastre inercial y deriva en yaw
    Odom/ResetCountdown: "0"               # 0=Desactivar reinicio a 0,0,0 en tracking loss
    OdomF2M/MaxSize: "5000"                # Memoria ampliada de mapa local para cierre de lazo con punto de partida
    
    # ── 2. Extracción y Matching de Puntos (GFTT/ORB Calibrado) ──
    Vis/CorType: "0"                       # 0=Features Matching
    Vis/FeatureType: "8"                   # 8=GFTT/ORB (óptimo con trama IR de RealSense)
    Vis/MaxFeatures: "1200"                # Mayor densidad sobre el campo de visión amplio (86°)
    Vis/MinInliers: "20"                   # Consistencia geométrica estricta (filtra correspondencias dudosas)
    Vis/EstimationType: "1"                # 1=PnP 3D->2D
    Vis/PnPReprojError: "1.8"              # Tolerancia RANSAC precisa contra ruido de profundidad
    Vis/MinDepth: "0.20"                   # Ignora ruido < 20 cm
    Vis/MaxDepth: "1.80"                   # Clave SOTA: Descarta fondo ruidoso (> 1.8 m) que deforma la escala
    
    # ── 3. Refinamiento Subpíxel (Erradica Jitter / Vibración Numérica) ──
    Vis/SubPixIterations: "15"             # Mayor precisión en interpolación continua
    Vis/SubPixWinSize: "5"                 # Ventana 5x5 de gradiente local para suavizado subpíxel
    
    # ── 4. Bundle Adjustment: ACTIVADO (elegido con el xArm5 como referencia, 2026-11-24) ──
    # Antes estaba en "0" con la idea, nunca medida, de que el ajuste de haces deformaba la escala. Medido: es al revés.
    # Experimento: 8 aproximaciones de v7 reproducidas por el robot, mismos bags reprocesados con cada candidato
    # (tools/xarm5/vio_gt/replay_candidates_vs_robot.sh; context.md, lección 47). Mediana entre corridas, "1" frente a "0":
    #   * ATE anclada 13,0 frente a 17,3 mm; p90 20,9 frente a 46,7; máx 49,6 frente a 74,0 (mejor en 7 de 8 corridas);
    #   * escala 1,7 frente a 2,6 %; RPE a 0,5 s 2,2 frente a 9,4 mm (4 veces menos ruido rápido).
    # El reprocesado es casi determinista (repetido: diferencias de 0-6 mm). Ningún candidato evita las pérdidas: vienen
    # de la falta de textura bajo ~0,35 m sobre el mantel blanco, no de la profundidad.
    # Validado en vivo el 2026-11-25 (benchmark_vo.py, 15 s, con la compresión del bag crudo activa): p50 26,8 / p90
    # 32,5 / p99 36,1 ms por frame (el ajuste de haces, 4,7 ms), 0 % de pérdidas y ~28 Hz en vez de 30. Se deja: el
    # recolector muestrea a 20 Hz e interpola, y esta odometría solo guía (las poses del dataset salen de DROID). Si
    # baja de ~20 Hz, volver a "0" ("0" tarda 16 ms, p99 21).
    OdomF2M/BundleAdjustment: "1"
    
    # ── 5. Filtrado y Origen Estricto en Lente ──
    Odom/FilteringStrategy: "1"            # Filtro Kalman para suavizado continuo (elimina vibración frame-to-frame)
    Odom/AlignWithGround: "false"          # Inicia en lente de cámara (0,0,0 estricto; sin traslación heurística al piso)
