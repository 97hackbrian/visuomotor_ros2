# Alineación de demostraciones reales (cámara a mano + RTAB-Map VIO) con el xArm5 para entrenar Diffusion Policy.
#
# Lo usa tools/xarm5/convert_vio_dataset_to_xarm5.py. Las demás fuentes, para que entrenamiento y robot coincidan
# sin duplicar valores:
#   * pose de inicio (home) y relative_coordinates -> deploy/jetson/config/jetson_policy_params.yaml (policy_node)
#   * orientation_mode, límites de inclinación/yaw, volumen y velocidades -> xarm5_real_params.yaml (xarm5_bridge)
#
# Modelo: cada episodio empieza con la cámara en la pose equivalente a HOME (la misma que la cámara tendría montada
# en la muñeca del xArm5 con el brazo en home). La odometría (marco 'odom', frame_id 'camera_link') se expresa
# relativa al primer frame del episodio y se lleva a link_base:
#   T_base_tcp(t) = T_base_tcp_home · T_tcp_cam · [T_odom_cam(0)^-1 · T_odom_cam(t)] · T_tcp_cam^-1
xarm5_dataset_alignment:
  # Extrínseca del montaje: pose de 'camera_link' (el frame_id de RTAB-Map, convención ROS: X adelante, Y izquierda,
  # Z arriba) expresada en el TCP del xArm5 (xarm_tcp = brida; Z de la herramienta apunta hacia fuera de la brida).
  # El soporte de la cámara en la mano y en la muñeca del robot debe ser EL MISMO.
  # Valor por defecto = suposición sin medir: cámara en la brida mirando a lo largo del eje de la herramienta
  # (X_cam = +Z_tcp) con su "arriba" hacia -X_tcp. MEDIR y poner extrinsic_calibrated: true antes de convertir.
  tcp_to_camera_xyz_m: [0.0, 0.0, 0.0]
  tcp_to_camera_rpy_rad: [0.0, -1.5707963, 0.0]   # ejes fijos X-Y-Z: R = Rz(yaw)·Ry(pitch)·Rx(roll)
  extrinsic_calibrated: false

  # Auditoría por episodio (se marcan; con --drop-flagged no se copian):
  max_orientation_deviation_rad: 0.15   # orientación demostrada vs. alcanzable (inclinación fuera del plano del brazo)
  max_workspace_violation_frames: 0     # frames con el TCP fuera del volumen de trabajo del puente
  speed_tolerance_ratio: 1.0            # velocidad lineal/angular demostrada <= ratio * límite del puente
  speed_window_steps: 4                 # ventana (pasos) para estimar velocidades sin amplificar el ruido del VIO
