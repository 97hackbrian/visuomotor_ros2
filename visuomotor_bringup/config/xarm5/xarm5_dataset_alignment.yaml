# Alineación de demostraciones reales (cámara a mano + RTAB-Map VIO) con el xArm5 para entrenar Diffusion Policy.
#
# Lo usa tools/xarm5/convert_vio_dataset_to_xarm5.py. Las demás fuentes, para que entrenamiento y robot coincidan
# sin duplicar valores:
#   * pose de inicio (home), relative_coordinates y quaternion_hemisphere -> deploy/jetson/config/jetson_policy_params.yaml
#   * orientation_mode, límites de inclinación/yaw, volumen y velocidades -> xarm5_real_params.yaml (xarm5_bridge)
#
# Modelo: cada episodio empieza con la cámara en la pose equivalente a HOME (la misma que la cámara tendría montada
# en la muñeca del xArm5 con el brazo en home). La odometría (marco 'odom', frame_id 'camera_link') se expresa
# relativa al primer frame del episodio y se lleva a link_base:
#   T_base_tcp(t) = T_base_tcp_home · T_tcp_cam · [T_odom_cam(0)^-1 · T_odom_cam(t)] · T_tcp_cam^-1
# (relativo al inicio: inmune a la deriva de odom entre episodios; la odometría NO se reinicia entre episodios y su
# "vertical" deriva hasta 50-60° a lo largo de una sesión, medido con los ArUco de la mesa el 2026-11-22).
xarm5_dataset_alignment:
  # Extrínseca del montaje: pose de 'camera_link' (convención ROS: X adelante, Y izquierda, Z arriba) en el TCP del
  # xArm5 (xarm_tcp = brida; Z de la herramienta apunta hacia fuera de la brida). El soporte de la cámara en la mano
  # y en la muñeca del robot debe ser EL MISMO.
  #
  # Orientación DETERMINADA CON LOS DATOS (2026-11-22, demonstrations_real_v7, 83 episodios):
  #   * Eje óptico = +Z_tcp (pitch -pi/2) y "arriba" de la imagen = +X_tcp (roll = pi): con el brazo en HOME3 la
  #     parte SUPERIOR de la imagen apunta hacia FUERA de la base (lado lejano de la mesa) y la inferior hacia la base.
  #   * Evidencia: (1) la gravedad del VIO al inicio de cada episodio frente a la de HOME3 da 57° de error mediano con
  #     rpy (0, -pi/2, 0) (0/83 episodios < 20°) y 13° con (pi, -pi/2, 0) (59/83 < 20°); (2) la pose de los ArUco de
  #     la mesa en el primer frame (independiente del VIO) da el eje óptico a 31° ± 6° de la vertical (HOME3: 24.6°)
  #     y la imagen DERECHA (giro ~0°), es decir, la persona sostuvo la cámara "derecha".
  #   * El valor anterior (0, -pi/2, 0) era la suposición sin medir y reflejaba los desplazamientos laterales de las
  #     demostraciones (TCP "detrás de la base", x hasta -0.04 m). Conservado en el historial de git.
  #   * IMPLICACIÓN DE DESPLIEGUE: montar la D435i en la brida con la imagen derecha en HOME3 (arriba de la imagen =
  #     lejos de la base). Si se monta girada 180°, las imágenes del robot quedarían invertidas respecto al dataset.
  #
  # MEDIDA CON EL ROBOT (2026-11-24, tools/xarm5/vio_gt/evaluate_vio_gt.py, cv2.calibrateHandEye DANIILIDIS):
  #   * 13 paradas del xArm5 mirando el tablero ChArUco, diversidad de giro 80°; residuo (dispersión del tablero en
  #     la base) mediana 3.1 mm / 0.27°, máx 7.0 mm / 0.56°.
  #   * Resultado: experiments/vio_gt/2026-11-24/runs/201446_static_board/hand_eye.json (T_tcp_camera_link).
  #   * Traslación (62.9, -16.3, 18.5) mm = 67.6 mm desde el TCP; rotación a 2.3° de la nominal (pi, -pi/2, 0).
  #   * v7_xarm5_v2 se convirtió con la traslación 0 y la rotación nominal: con un giro de 30° de la herramienta, la
  #     palanca de 67.6 mm mueve el TCP convertido ~3.5 cm. demonstrations_real_v7_xarm5_v3.zarr usa estos valores.
  #   * Vale mientras el soporte de la cámara en la brida sea el mismo: si se desmonta, volver a medir.
  # Anterior (sin medir, hasta el 2026-11-24): xyz [0, 0, 0], rpy [3.14159265, -1.5707963, 0.0].
  tcp_to_camera_xyz_m: [0.06293, -0.01626, 0.01849]
  tcp_to_camera_rpy_rad: [3.13372, -1.53072, 0.00445]   # ejes fijos X-Y-Z: R = Rz(yaw)·Ry(pitch)·Rx(roll)
  extrinsic_calibrated: true

  # Filtro de la trayectoria VIO antes de convertir (visuomotor_core/dataset/trajectory_filters.py).
  # PSD medida en v7: movimiento humano < ~0.8 Hz, piso de ruido plano desde ~0.9 Hz; residuo ~8 mm RMS isótropo
  # (ruido del VIO en movimiento, no artefacto de muestreo) y saltos aislados de 3-9 cm. Sin filtrar, la velocidad
  # aparente es 0.20 m/s; la real es ~0.05 m/s (picos 0.13-0.21 m/s). La política aprendería el ruido como objetivo.
  trajectory_filter:
    enabled: true
    hampel_half_window: 3        # 7 muestras (0.35 s)
    hampel_n_sigma: 3.0
    lowpass_cutoff_hz: 1.5       # Butterworth de fase cero (filtfilt): conserva < 0.8 Hz, corta el piso de ruido
    lowpass_order: 4
    filter_orientation: true

  # Convención de signo del cuaternión del dataset convertido: "home" (dot(q, q_home) >= 0, con q_home = rpy de HOME
  # de jetson_policy_params.yaml) es continua con la garra hacia abajo; "qw_positive" salta de signo cerca de HOME3.
  # El checkpoint la hereda (train.py --quaternion_hemisphere auto) y policy_node la lee del checkpoint ('auto').
  quaternion_hemisphere: "home"

  # Auditoría por episodio (se marcan; con --drop-flagged no se copian):
  max_orientation_deviation_rad: 0.70   # inclinación fuera del plano del brazo (lo que el xArm5 no puede imitar)
  max_raw_step_m: 0.15                  # salto de la odometría entre frames (0.15 m en 50 ms = pérdida de tracking)
  workspace_tolerance_m: 0.03           # recortes del puente menores que esto no cuentan (bordes de la caja)
  max_workspace_violation_frames: 100000
  max_workspace_violation_fraction: 0.5 # objeto fuera del volumen del puente la mitad del episodio -> no ejecutable
  speed_tolerance_ratio: 6.0            # tras filtrar: <= 6 x límite del puente (0.30 m/s, 3.0 rad/s); >> indica giros
                                        # de muñeca de ~180° que el yaw acotado (±2.6 rad) convierte en saltos
  speed_window_steps: 4                 # ventana (pasos) para estimar velocidades
